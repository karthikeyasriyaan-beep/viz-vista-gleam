    <!-- Google Consent Mode v2 — must run BEFORE gtag loads -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Default: deny all non-essential until the user consents
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // If the user has already consented in a previous visit, restore their choice from the real cookie
      (function() {
        var match = document.cookie.split('; ').find(function(r){ return r.startsWith('trackora_consent='); });
        var saved = match ? match.split('=')[1] : null;
        if (saved === 'accepted') {
          gtag('consent', 'update', {
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        } else if (saved === 'essential-only') {
          gtag('consent', 'update', {
            analytics_storage: 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          });
        }
      })();
    </script>
